name: test
on:
  pull_request:
    paths:
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python3 -m pytest tests/ -v --tb=short

      - name: CI smoke (extract da mini repo git + summarize)
        run: |
          mkdir -p /tmp/senato-smoke/Leg19/Atto00055177/ddlpres
          cp tests/fixtures/sample.akn.xml \
             /tmp/senato-smoke/Leg19/Atto00055177/ddlpres/01360967-ft.akn.xml
          git -C /tmp/senato-smoke init -q
          git -C /tmp/senato-smoke add -A
          git -C /tmp/senato-smoke -c user.email=t -c user.name=t commit -qm smoke
          python3 scripts/extract.py --repo-dir /tmp/senato-smoke \
            --limit 1 --out /tmp/senato-ci-test.parquet
          python3 scripts/build_summaries.py --input /tmp/senato-ci-test.parquet
