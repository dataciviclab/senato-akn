name: test

on:
  pull_request:
    paths:
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
      - "datasets/**"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
      - "datasets/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          # `dashboard` serve ai test della dashboard (streamlit + lab-connectors)
          install-extras: "dev,dashboard"

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "senato_akn scripts tests dashboard"
          mypy_paths: "senato_akn scripts"
          test_dir: "tests dashboard/tests"
          pytest_args: "-q"

      - name: CI smoke (extract da mini repo git)
        run: |
          mkdir -p /tmp/senato-smoke/Leg19/Atto00055177/ddlpres
          cp tests/fixtures/sample.akn.xml \
             /tmp/senato-smoke/Leg19/Atto00055177/ddlpres/01360967-ft.akn.xml
          git -C /tmp/senato-smoke init -q
          git -C /tmp/senato-smoke add -A
          git -C /tmp/senato-smoke -c user.email=t -c user.name=t commit -qm smoke
          python3 scripts/extract.py --repo-dir /tmp/senato-smoke \
            --limit 1 --out /tmp/senato-ci-test.parquet
