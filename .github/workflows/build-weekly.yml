name: build-weekly
on:
  schedule:
    # Weekly: tutte le tipologie Leg19 (full corpus, ~3 ore)
    - cron: "0 4 * * 0"    # ogni domenica alle 04:00 UTC
  workflow_dispatch:

jobs:
  build-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          pip install -e ".[dev]"

      - name: Extract full Leg19 corpus
        run: |
          python3 scripts/extract.py \
            --legislatura Leg19 \
            --tipologie all \
            --drop-zero-text \
            --sleep-ms 100 \
            --out data/derived/leg19_all_v0.csv

      - name: Generate summaries
        run: |
          python3 scripts/build_summaries.py --input data/derived/leg19_all_v0.csv

      - name: Upload full corpus as artifact
        uses: actions/upload-artifact@v4
        with:
          name: senato-corpus-full
          path: data/derived/
          retention-days: 60

      - name: Build size report
        run: |
          echo "## Report dimensioni" >> $GITHUB_STEP_SUMMARY
          ls -lh data/derived/ >> $GITHUB_STEP_SUMMARY
