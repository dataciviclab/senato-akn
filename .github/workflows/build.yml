name: build
on:
  workflow_dispatch:
    inputs:
      tipologie:
        description: "Tipologie da estrarre (all per tutte)"
        default: "ddlpres"
        required: false
      legislatura:
        description: "Legislatura"
        default: "Leg19"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          pip install -e ".[dev]"

      - name: Extract corpus
        run: |
          TIPOLOGIE="${{ github.event.inputs.tipologie || 'ddlpres' }}"
          LEGISLATURA="${{ github.event.inputs.legislatura || 'Leg19' }}"
          echo "Estrazione: $LEGISLATURA / $TIPOLOGIE"
          python3 scripts/extract.py \
            --legislatura "$LEGISLATURA" \
            --tipologie "$TIPOLOGIE" \
            --drop-zero-text \
            --out data/derived/leg19_dispatch_v0.parquet

      - name: Generate summaries
        run: |
          python3 scripts/build_summaries.py --input data/derived/leg19_dispatch_v0.parquet

      - name: Upload derived data as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: senato-corpus
          path: data/derived/
          retention-days: 30
