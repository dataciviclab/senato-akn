name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "**.py"
      - "Makefile"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: senato-akn-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "senato-akn"
      run-command: "make pipeline"
      detect-paths: "datasets"
    secrets: inherit
