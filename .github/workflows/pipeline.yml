# Pipeline — extract → union → toolkit → GCS → registry
#
# Tutta la logica è nel Makefile. Questo workflow chiama `make pipeline`
# e poi pubblica su GCS.

name: pipeline
on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: senato-akn-pipeline
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCS_CLEAN: gs://dataciviclab-clean
  GCS_MART: gs://dataciviclab-mart
  YEAR: "2026"

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main

      - name: GCP Auth (WIF)
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Pipeline
        run: make pipeline

      - name: Publish to GCS
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          for slug in $(ls out/data/clean/ 2>/dev/null); do
            gsutil -m rsync -r "out/data/clean/$slug/${{ env.YEAR }}/" \
              "${{ env.GCS_CLEAN }}/$slug/${{ env.YEAR }}/"
          done
          for slug in $(ls out/data/mart/ 2>/dev/null); do
            gsutil -m rsync -r "out/data/mart/$slug/${{ env.YEAR }}/" \
              "${{ env.GCS_MART }}/$slug/${{ env.YEAR }}/"
          done
          for f in data/derived/leg_unified_*.parquet; do
            [ -f "$f" ] && gsutil -q cp "$f" "${{ env.GCS_CLEAN }}/_derived/$(basename $f)"
          done

      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
