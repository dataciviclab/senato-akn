# Pipeline — manutenzione del corpus: extract → toolkit → GCS → registry
#
# Orchestratore sottile (ADR-001): esegue TUTTI i dataset in datasets/ e
# sincronizza per directory di output (niente slug hardcodato). Un dataset
# nuovo entra automaticamente — basta che il suo parquet raw sia prodotto.
#
# Flusso:
#   1. restore stato estrazione (parquet + manifest da GCS, per dataset)
#   2. estrazione: parquet derivati per i dataset (incrementale)
#   3. toolkit run su tutti i dataset (raw local_file → clean → mart)
#   4. sync GCS: clean+mart (canonici) + stato _derived (per il delta)
#   5. registry → draft PR
#
# Trigger:
#   - schedule mensile → incremental (tutti i dataset)
#   - pull_request merged su datasets/**.py → incremental
#   - workflow_dispatch: mode = incremental | full (artifact corpus completo)

name: pipeline
on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "**.py"
      - "Makefile"
      - "pyproject.toml"
      - "requirements.txt"
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (delta + publish) | full (corpus completo, artifact)"
        default: "incremental"
        required: false

concurrency:
  group: senato-akn-pipeline
  cancel-in-progress: false

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCS_CLEAN: gs://dataciviclab-clean
  GCS_MART: gs://dataciviclab-mart
  YEAR: "2026"
  LEGISLATURA: Leg19
  # Parquet derivati per dataset (raw local_file). Un nuovo dataset qui:
  # parquet + manifest, e il loop extract/sync lo prende.
  FULL_TIPOLOGIE: ddlpres,emend,emendc,ddlmess,ddlcomm,resaula,sommcomm
  OUT_DDLPRES: data/derived/leg19_ddlpres_v0.parquet
  OUT_EMEND: data/derived/leg19_emend_emendc_v0.parquet
  OUT_DIBATTITO: data/derived/leg19_resaula_sommcomm_v0.parquet
  FULL_OUT: data/derived/leg19_full_v0.parquet

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dataciviclab/.github/actions/python-setup@main

      # ── Auth GCP (WIF) ─────────────────────────────────────────
      - name: GCP Auth (WIF)
        id: gcp
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/setup-gcloud@v3

      # ── Mode: incremental di default (schedule/merge); dispatch può
      #    chiedere full ─────────────────────────────────────────────
      - name: Resolve mode
        id: mode
        run: |
          MODE="incremental"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode || 'incremental' }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Mode: $MODE"

      # ── Restore stato estrazione (solo incremental) ────────────────
      - name: Restore extraction state from GCS
        if: env.MODE == 'incremental' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          mkdir -p data/derived
          for out in "${{ env.OUT_DDLPRES }}" "${{ env.OUT_EMEND }}" "${{ env.OUT_DIBATTITO }}"; do
            f="$(basename "$out")"
            m="${f%.parquet}.manifest.json"
            for x in "$f" "$m"; do
              if gsutil -q cp "${{ env.GCS_CLEAN }}/_derived/$x" "data/derived/$x" 2>/dev/null; then
                echo "state restored: $x"
              else
                echo "state assente (primo run): $x"
              fi
            done
          done

      # ── Estrazione (incrementale per dataset) ──────────────────────
      - name: Extract ddlpres
        if: env.MODE == 'incremental'
        run: |
          python3 scripts/extract.py \
            --legislatura "${{ env.LEGISLATURA }}" \
            --tipologie ddlpres \
            --drop-zero-text \
            --out "${{ env.OUT_DDLPRES }}" \
            --incremental

      - name: Extract emend+emendc
        if: env.MODE == 'incremental'
        run: |
          python3 scripts/extract.py \
            --legislatura "${{ env.LEGISLATURA }}" \
            --tipologie emend,emendc \
            --drop-zero-text \
            --out "${{ env.OUT_EMEND }}" \
            --incremental

      - name: Extract dibattito (resaula+sommcomm)
        if: env.MODE == 'incremental'
        run: |
          python3 scripts/extract.py \
            --legislatura "${{ env.LEGISLATURA }}" \
            --tipologie resaula,sommcomm \
            --drop-zero-text \
            --out "${{ env.OUT_DIBATTITO }}" \
            --incremental

      - name: Extract full corpus (tipologie parsate)
        if: env.MODE == 'full'
        run: |
          python3 scripts/extract.py \
            --legislatura "${{ env.LEGISLATURA }}" \
            --tipologie "${{ env.FULL_TIPOLOGIE }}" \
            --drop-zero-text \
            --out "${{ env.FULL_OUT }}"

      # ── Layer toolkit: run su TUTTI i dataset ──────────────────────
      - name: Run toolkit
        if: env.MODE == 'incremental'
        run: |
          for cfg in datasets/*/dataset.yml; do
            echo "=== $cfg ==="
            python3 -m toolkit.cli.app run --config "$cfg"
          done

      # ── Sync GCS: per directory di output (niente slug hardcodato) ─
      - name: Publish clean + mart + state to GCS
        if: env.MODE == 'incremental' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        run: |
          for slug in $(ls out/data/clean/ 2>/dev/null); do
            gsutil -m rsync -r -x ".*/_(run|validate)/.*|.*/metadata\.json$" \
              "out/data/clean/$slug/${{ env.YEAR }}/" \
              "${{ env.GCS_CLEAN }}/$slug/${{ env.YEAR }}/"
            echo "✅ $slug clean synced"
          done
          for slug in $(ls out/data/mart/ 2>/dev/null); do
            gsutil -m rsync -r -x ".*/_(run|validate)/.*|.*/metadata\.json$" \
              "out/data/mart/$slug/${{ env.YEAR }}/" \
              "${{ env.GCS_MART }}/$slug/${{ env.YEAR }}/"
            echo "✅ $slug mart synced"
          done
          # stato di estrazione (parquet+manifest) per il delta su runner fresco
          for out in "${{ env.OUT_DDLPRES }}" "${{ env.OUT_EMEND }}" "${{ env.OUT_DIBATTITO }}"; do
            f="$(basename "$out")"
            m="${f%.parquet}.manifest.json"
            gsutil -q cp "data/derived/$f" "${{ env.GCS_CLEAN }}/_derived/$f"
            [ -f "data/derived/$m" ] && gsutil -q cp "data/derived/$m" "${{ env.GCS_CLEAN }}/_derived/$m"
          done
          echo "✅ state published"

      # ── Artifact del corpus full (dispatch mode=full) ──────────────
      - name: Upload full corpus artifact
        if: env.MODE == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: senato-corpus-full
          path: data/derived/
          retention-days: 60

      # ── Registry (artifact catalogo) → draft PR (composite, stesso job) ──
      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
