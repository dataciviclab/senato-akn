name: build-full
on:
  workflow_dispatch:

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install package and dependencies
        run: |
          pip install -e ".[dev]"

      - name: Extract Leg19 corpus (tipologie con parser)
        run: |
          python3 scripts/extract.py \
            --legislatura Leg19 \
            --tipologie ddlpres,emend,ddlmess,ddlcomm \
            --drop-zero-text \
            --sleep-ms 20 \
            --out data/derived/leg19_full_v0.parquet

      - name: Generate summaries
        run: |
          python3 scripts/build_summaries.py --input data/derived/leg19_full_v0.parquet

      - name: Upload full corpus as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: senato-corpus-full
          path: data/derived/
          retention-days: 60

      - name: Build size report
        run: |
          echo "## Report dimensioni" >> $GITHUB_STEP_SUMMARY
          ls -lh data/derived/ >> $GITHUB_STEP_SUMMARY
