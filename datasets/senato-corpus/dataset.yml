root: "../../out"
schema_version: 1

dataset:
  name: "senato_corpus"
  source_id: "senato_akn"
  description: "Corpus Akoma Ntoso del Senato (ddlpres Leg16–Leg19, ddlmess Leg17–Leg19, ddlcomm Leg16–Leg19): ogni disegno di legge, messaggio e relazione di commissione con famiglia, peso testuale e articoli. Emendamenti e dibattito sono dataset separati. Deriva dall'estrazione XML di senato-akn; atto_num collega a senato_ddl via ddl_url (/ddl/N)."
  tags: [politica, senato, corpus, akoma-ntoso, legislativo]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 2010
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "corpus_parquet"
      type: "local_file"
      args:
        path: "../../data/derived/leg_unified_corpus_v0.parquet"
        filename: "leg_unified_corpus_v0.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns: [atto_num, document_id, doc_title, work_date, tipologia, text_len, articles_count]
  validate:
    not_null: [atto_num, document_id]
    # una riga = un documento XML del corpus
    # path è unico; document_id può ripetersi tra tipologie (ddlmess/ddlcomm)
    primary_key: [path]
    min_rows: 1000

mart:
  tables:
    - name: "mart_per_atto"
      sql: "sql/mart_per_atto.sql"
    - name: "mart_per_legislatura"
      sql: "sql/mart_per_legislatura.sql"
    - name: "mart_famiglie"
      sql: "sql/mart_famiglie.sql"
  required_tables:
    - "mart_per_atto"
    - "mart_per_legislatura"
    - "mart_famiglie"
  validate:
    table_rules:
      mart_per_atto:
        required_columns: [atto_num, n_documenti, testo_totale]
        primary_key: [atto_num]
        min_rows: 1000
      mart_per_legislatura:
        required_columns: [legislatura, n_documenti, testo_totale, n_atti]
        primary_key: [legislatura]
        min_rows: 3
      # una riga per famiglia, con `famiglia` esplosa dal valore multi-valore.
      # Le percentuali non sono esclusive (un documento può avere più famiglie).
      mart_famiglie:
        required_columns: [famiglia, n_documenti, testo_totale, pct_documenti, pct_testo]
        primary_key: [famiglia]
        min_rows: 3

validation:
  fail_on_error: true
