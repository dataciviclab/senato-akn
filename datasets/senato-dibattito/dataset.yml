# Dibattito parlamentare (Leg14–Leg19) — resoconti Aula (resaula) + Commissione (sommcomm)
#
# Il "chi parla e cosa dice" del Senato: ogni intervento (speech) con oratore.
# Parser an:debate (debateBody → debateSection → speech by=#pNNNN → from).
# Il bridge è su persona_id (#pNNNNN) → senato_anagrafica (open-politica).
root: "../../out"
schema_version: 1

dataset:
  name: "senato_dibattito"
  source_id: "senato_akn"
  description: "Ogni intervento parlamentare nelle legislature Leg14–Leg19 (Aula `resaula` e Commissione `sommcomm`), dal corpus Akoma Ntoso. Una riga = un intervento, con oratore (bridge osr:Persona → senato_anagrafica) e testo."
  tags: [politica, senato, dibattito, interventi, resoconti, oratori]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 2015
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "dibattito_parquet"
      type: "local_file"
      args:
        path: "../../data/derived/leg_unified_resaula_sommcomm_v0.parquet"
        filename: "leg_unified_resaula_sommcomm_v0.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns: [tipologia, data_seduta, document_id, path, legislatura, senatore_id, persona_id, nome_oratore, ruolo, text_len]
  validate:
    # Transizione raw→clean: cambio di granularità INTENZIONALE (documenti →
    # interventi, via UNNEST). Le 18 colonne rimosse sono i campi a livello
    # documento (URI FRBR, titoli, conteggi) — il dettaglio vive nel resoconto;
    # qui restano i campi per intervento. Il drop è documentato in clean.sql.
    transition:
      warn_removed_columns: false
    not_null: [senatore_id, text_len]
    # una riga = un intervento (path + ordine nello speech sequence)
    primary_key: [path, senatore_id, ordine_intervento]
    min_rows: 100000

mart:
  tables:
    - name: "mart_interventi_per_persona"
      sql: "sql/mart_interventi_per_persona.sql"
    - name: "mart_dibattito_per_seduta"
      sql: "sql/mart_dibattito_per_seduta.sql"
    - name: "mart_dib_per_atto"
      sql: "sql/mart_dib_per_atto.sql"
  required_tables:
    - "mart_interventi_per_persona"
  validate:
    table_rules:
      mart_interventi_per_persona:
        required_columns: [senatore_id, n_interventi, testo_totale, n_aula, n_commissione]
        primary_key: [senatore_id]
        min_rows: 100
      mart_dibattito_per_seduta:
        required_columns: [data_seduta, n_interventi, n_oratori, testo_totale]
        primary_key: [data_seduta]
        min_rows: 100
      mart_dib_per_atto:
        required_columns: [atto_num, n_interventi, n_oratori, testo_totale]
        primary_key: [atto_num]
        min_rows: 100

validation:
  fail_on_error: true
