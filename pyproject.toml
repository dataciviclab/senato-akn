[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senato-akn"
version = "0.2.0"
description = "Corpus legislativo del Senato in formato Akoma Ntoso"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "DataCivicLab" }]

# Dipendenze runtime dirette: pyarrow (parquet del corpus), duckdb (union e findings).
dependencies = [
    "duckdb>=1.5.3,<2",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
# Il toolkit è usato solo come CLI (`python -m toolkit.cli.app`), non importato.
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
dev = [
    "mypy>=1.20",
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.5",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3,<2",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Repository = "https://github.com/dataciviclab/senato-akn"

[tool.setuptools.packages.find]
include = ["senato_akn*"]
exclude = ["tests*", "dashboard*", "scripts*"]

# Config allineata allo standard org (workspace root): il repo non deve
# dipendere dalla config del workspace per lint e type check in CI.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = false
no_implicit_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: test che fa chiamate HTTP reali (richiede SMOKE_TESTS=1)",
]
