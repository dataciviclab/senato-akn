[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "senato-akn"
version = "0.2.0"
description = "Corpus legislativo del Senato in formato Akoma Ntoso"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "DataCivicLab"}]
dependencies = [
    "pyarrow>=15.0.0",
]

[tool.setuptools.packages.find]
include = ["senato_akn*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: test che fa chiamate HTTP reali (richiede SMOKE_TESTS=1)",
]
