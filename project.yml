project:
  slug: senato-akn
  title: Senato Akoma Ntoso
  status: active
  kind: corpus-project

source:
  owner: SenatoDellaRepubblica
  repo: AkomaNtosoBulkData
  url: https://github.com/SenatoDellaRepubblica/AkomaNtosoBulkData
  format: xml-akoma-ntoso
  license: CC BY 3.0

scope:
  legislature: [Leg14, Leg15, Leg16, Leg17, Leg18, Leg19]
  document_types:
    - ddlpres        # disegni di legge presentati (Leg16–Leg19)
    - ddlmess        # messaggi Camera-Senato (Leg17–Leg19)
    - ddlcomm        # relazioni commissione (Leg16–Leg19)
    - emend          # emendamenti Aula (Leg14–Leg19)
    - emendc         # emendamenti Commissione (Leg14–Leg19)
    - resaula        # resoconti Aula, parser an:debate (Leg17–Leg19)
    - sommcomm       # resoconti Commissione, parser an:debate (Leg18–Leg19)
  coverage_notes:
    - "Leg14–Leg15: solo emend/emendc"
    - "Leg16: 14 ddlpres + 9 ddlcomm, nessun dibattito"
    - "Leg17: 1 seduta Aula pubblicata (3 resoconti nell'upstream), 0 resoconti Commissione"
    - "Leg18–Leg19: corpus completo (atti, emendamenti, dibattito)"
  public_stage: public

outputs:
  derived: data/derived/          # gitignored, effimero (runner GitHub)
  published:
    clean: "gs://dataciviclab-clean/senato-akn/"
    mart: "gs://dataciviclab-mart/senato-akn/"
  format: parquet

infrastructure:
  ci:
    - test: PR + push (pytest core + dashboard, smoke extract)
    - pipeline: post-merge + schedule mensile (make pipeline → GCS + registry PR)
  schedule: "0 6 1 * *" # mensile — estrazione completa + toolkit run
  pipeline_runtime: "~25 min (clone 11 GB + parse ~1,4 M file)"
  artifacts: "nessuno — la pubblicazione è su GCS (clean + mart)"

decisions:
  toolkit: yes # 3 dataset raw→clean→mart (senato-corpus, senato-dibattito, senato-emendamenti)
  dataset_incubator: no
  public_discussion: yes
  extraction: "full refresh mensile, non incrementale: i parquet derivati non sopravvivono al runner"
  next_step: "incrocio proposto (Senato) vs legge vigente (italia-corpus) — F5"
