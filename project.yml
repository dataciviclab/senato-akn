project:
  slug: senato-akn
  title: Senato Akoma Ntoso
  status: active
  kind: corpus-project

source:
  owner: SenatoDellaRepubblica
  repo: AkomaNtosoBulkData
  url: https://github.com/SenatoDellaRepubblica/AkomaNtosoBulkData
  format: xml-akoma-ntoso
  license: CC BY 3.0

scope:
  legislature: Leg19
  document_types:
    - ddlpres        # disegni di legge presentati ✅
    - ddlmess        # messaggi Camera-Senato ✅
    - ddlcomm        # relazioni commissione ✅
    - emend          # emendamenti Aula ✅
    - emendc         # emendamenti Commissione ✅
    - resaula        # resoconti Aula (parser da estendere)
    - sommcomm       # resoconti Commissione (parser da estendere)
  public_stage: public

outputs:
  derived: data/derived/
  csv_pattern: "{legislatura}_{tipologie}_v0.csv"

infrastructure:
  ci:
    - test: PR + push (smoke extract + pytest)
    - build: on demand via workflow_dispatch (ddlpres)
    - build-full: on demand via workflow_dispatch (ddlpres,emend,ddlmess,ddlcomm)
  schedule: "0 6 1 * *" # mensile — estrazione incrementale + toolkit run
  artifacts:
    retention: 30-60 giorni

decisions:
  toolkit: no
  dataset_incubator: no
  public_discussion: yes
  next_step: "bridge dibattito → open-politica + incrocio con italia-corpus (F5)"
